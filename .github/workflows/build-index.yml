name: build-index

# 每 6 小时自动跑一次；push 这些文件时也跑；也可以在 Actions 页面手动 Run workflow
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [sources.json, scripts/**, .github/workflows/build-index.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check signing secret is configured
        env:
          INDEX_SIGNING_KEY: ${{ secrets.INDEX_SIGNING_KEY }}
        run: |
          # 只打印长度，绝不打印内容 —— 用来区分「没配」「配到别的仓库」「配成了 Variable」
          echo "INDEX_SIGNING_KEY length = ${#INDEX_SIGNING_KEY}"
          if [ -z "$INDEX_SIGNING_KEY" ]; then
            echo "::error::本仓库没有读到 INDEX_SIGNING_KEY。请逐条检查："
            echo "  1) 是不是加到了别的仓库？（必须在 EVEjs-mods 这个仓库里）"
            echo "  2) 加的是 Secret 还是 Variable？必须是 Settings → Secrets and variables → **Actions** → Secrets"
            echo "  3) 名字必须完全一致：INDEX_SIGNING_KEY（区分大小写，前后不要有空格）"
            echo "  4) 如果你加 secret 之前就跑了这次 workflow，加完要重新跑（加 secret 不会自动重跑）"
            echo ""
            echo "不想配 secret 也有兜底：本机跑一次下面这行，然后提交 docs/mod-index.json 即可"
            echo "  INDEX_SIGNING_KEY=\"\$(cat .keys/index.key)\" node scripts/build-index.mjs"
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "::warning::定时任务跳过本次（未配置 INDEX_SIGNING_KEY）"
              echo "SKIP_BUILD=1" >> "$GITHUB_ENV"
              exit 0
            fi
            exit 1
          fi
          echo "::notice::已读到签名私钥（长度 ${#INDEX_SIGNING_KEY}）"
        # 定时任务在没配密钥时「静默跳过」，避免一天 4 次红叉；手动/推送触发才报错提醒

      - name: Build and sign mod-index.json
        if: env.SKIP_BUILD != '1'
        env:
          INDEX_SIGNING_KEY: ${{ secrets.INDEX_SIGNING_KEY }}
        run: node scripts/build-index.mjs

      - name: Commit regenerated index back to main
        if: env.SKIP_BUILD != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/mod-index.json author-keys.json
          if [ -n "$(git status --porcelain docs/mod-index.json author-keys.json)" ]; then
            git commit -m "chore(index): refresh mod-index.json"
            git push
          else
            echo "索引没有变化，跳过提交"
          fi